# Publishes the two demo sites to GitHub Pages on every push to main.
# Live at https://johndoe006767-commits.github.io/e2e-website/
#   /                  landing page (pages/index.html)
#   /tower-overview3/  tower-overview3/website/dist
#   /gfs-merged/       gfs-merged/website/dist
# Only these folders are published; nothing else in the repo goes live.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir _site
          cp pages/index.html _site/index.html
          cp -R tower-overview3/website/dist _site/tower-overview3
          cp -R gfs-merged/website/dist _site/gfs-merged
          find _site -name '.DS_Store' -delete
          du -sh _site/*

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
