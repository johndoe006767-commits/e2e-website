<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#331c41"><title>Finance towers | AstraZeneca</title><link rel="stylesheet" href="style.css?v=20261014-hb2"><link rel="stylesheet" href="process-flow.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head>
<body>
<section id="section-1" aria-label="Finance anatomy"><header><img src="./assets/astrazeneca.svg" alt="AstraZeneca" width="120" height="30"></header>
<main id="experience" aria-label="Interactive finance anatomy"><canvas id="scene" aria-label="Skeleton, heart and eight finance organs"></canvas><div id="labels"></div><div id="hb-legend" class="hb-legend" aria-hidden="true"></div>
<div id="loading" role="status"><div class="load-body"></div><p id="load-message">Assembling your anatomy…</p><button id="retry" hidden>Try again</button></div>
<section id="detail" hidden><div id="process-neurons" aria-label="Tower processes"></div><p id="process-status" class="process-status" role="status" aria-live="polite"></p><button id="back"><span class="control-symbol" aria-hidden="true">←</span><span>Back to overview</span></button><div class="detail-title"><p id="organ-name"></p><span class="demo-data">Illustrative processes</span><h2 id="tower-name"></h2></div><div class="rotate-tools"><button id="reset"><span class="control-symbol reset-symbol" aria-hidden="true">↺</span><span>Reset view</span></button></div>
      <div id="tower-telemetry-hud" class="telemetry-hud" aria-label="Process Automation Vital Signs">
      <div class="hud-header">
        <div class="hud-title-wrap">
          <span class="hud-eyebrow">BIOPROCESS VITAL SIGNS</span>
          <div class="hud-tower-name" id="hud-tower-title">O2C TELEMETRY</div>
        </div>
        <div class="hud-header-actions">
          <button id="hud-handoff-btn" class="hud-action-btn hud-modal-trigger" data-view="handoffs" type="button" title="View Input/Output Flow Dependencies">
            <span class="btn-icon">⇄</span>
            <span>Handoffs</span>
          </button>
          <div class="hud-score-badge">
            <div class="hud-score-value" id="hud-score-pct">38%</div>
            <div class="hud-score-label">HEALTH SCORE</div>
          </div>
        </div>
      </div>
      <div class="hud-ecg-container">
        <svg class="hud-ecg-svg" viewBox="0 0 200 20" preserveAspectRatio="none">
          <path class="hud-ecg-track" d="M0,10 L50,10 L54,3 L60,18 L65,5 L70,15 L74,10 L200,10" />
          <path class="hud-ecg-pulse" d="M0,10 L50,10 L54,3 L60,18 L65,5 L70,15 L74,10 L200,10" />
        </svg>
      </div>
      <div class="hud-bar-container" title="Click any segment to view activities">
        <div class="hud-bar-segment seg-automated hud-modal-trigger" data-view="auto" id="hud-bar-auto" style="width: 0%;"></div>
        <div class="hud-bar-segment seg-semi hud-modal-trigger" data-view="semi" id="hud-bar-semi" style="width: 0%;"></div>
        <div class="hud-bar-segment seg-manual hud-modal-trigger" data-view="manual" id="hud-bar-manual" style="width: 0%;"></div>
      </div>
      <div class="hud-legend">
        <button class="hud-legend-item hud-modal-trigger" type="button" data-view="auto">
          <span class="legend-dot dot-auto"></span><span id="hud-count-auto">8</span> Auto ↗
        </button>
        <button class="hud-legend-item hud-modal-trigger" type="button" data-view="semi">
          <span class="legend-dot dot-semi"></span><span id="hud-count-semi">14</span> Semi ↗
        </button>
        <button class="hud-legend-item hud-modal-trigger" type="button" data-view="manual">
          <span class="legend-dot dot-manual"></span><span id="hud-count-manual">18</span> Manual ↗
        </button>
      </div>
      <div class="hud-chips">
        <button class="hud-chip chip-tpi hud-modal-trigger" type="button" data-view="tpis">
          <span class="chip-icon">🔗</span>
          <span class="chip-val" id="hud-count-tpi">8</span>
          <span class="chip-lbl">TPIs ↗</span>
        </button>
        <button class="hud-chip chip-ai hud-modal-trigger" type="button" data-view="ai">
          <span class="chip-icon">⚡</span>
          <span class="chip-val" id="hud-count-ai">15</span>
          <span class="chip-lbl">AI Opps ↗</span>
        </button>
        <button class="hud-chip chip-pain hud-modal-trigger" type="button" data-view="pain">
          <span class="chip-icon">⚠️</span>
          <span class="chip-val" id="hud-count-pain">15</span>
          <span class="chip-lbl">Pain Points ↗</span>
        </button>
      </div>
    </div>
      <div class="hud-ecg-container">
        <svg class="hud-ecg-svg" viewBox="0 0 200 20" preserveAspectRatio="none">
          <path class="hud-ecg-track" d="M0,10 L50,10 L54,3 L60,18 L65,5 L70,15 L74,10 L200,10" />
          <path class="hud-ecg-pulse" d="M0,10 L50,10 L54,3 L60,18 L65,5 L70,15 L74,10 L200,10" />
        </svg>
      </div>
      <div class="hud-bar-container" title="Click any segment to drill down into activities">
        <div class="hud-bar-segment seg-automated hud-filter-btn" data-filter="Automated" id="hud-bar-auto" style="width: 0%;"></div>
        <div class="hud-bar-segment seg-semi hud-filter-btn" data-filter="Semi-automated" id="hud-bar-semi" style="width: 0%;"></div>
        <div class="hud-bar-segment seg-manual hud-filter-btn" data-filter="Manual" id="hud-bar-manual" style="width: 0%;"></div>
      </div>
      <div class="hud-legend">
        <button class="hud-legend-item hud-filter-btn" type="button" data-filter="Automated">
          <span class="legend-dot dot-auto"></span><span id="hud-count-auto">8</span> Auto ↗
        </button>
        <button class="hud-legend-item hud-filter-btn" type="button" data-filter="Semi-automated">
          <span class="legend-dot dot-semi"></span><span id="hud-count-semi">14</span> Semi ↗
        </button>
        <button class="hud-legend-item hud-filter-btn" type="button" data-filter="Manual">
          <span class="legend-dot dot-manual"></span><span id="hud-count-manual">18</span> Manual ↗
        </button>
      </div>
      <div class="hud-chips">
        <button class="hud-chip chip-tpi hud-filter-btn" type="button" data-filter="TPI">
          <span class="chip-icon">🔗</span>
          <span class="chip-val" id="hud-count-tpi">8</span>
          <span class="chip-lbl">TPIs ↗</span>
        </button>
        <button class="hud-chip chip-pain hud-filter-btn" type="button" data-filter="Pain">
          <span class="chip-icon">⚠️</span>
          <span class="chip-val" id="hud-count-pain">15</span>
          <span class="chip-lbl">Pain Points ↗</span>
        </button>
      </div>
    </div>
</section>
</main>
<footer><input id="assembly" type="range" min="0" max="1000" value="0" aria-label="Assemble or disassemble organs"></footer>
</section>
<section id="process-section" aria-labelledby="flow-title" hidden>
<div class="flow-heading"><h2 id="flow-title" tabindex="-1"></h2></div>
<div class="flow-column"><div class="flow-toolbar"><button id="flow-back">← Back to model</button></div>
<div id="activity-infusion" class="activity-infusion">
<svg class="infusion-tube" aria-hidden="true"><path class="infusion-tube-shell"/><path class="infusion-tube-blood"/></svg>
<div class="infusion-start"><div id="flow-bag" class="infusion-model infusion-bag" role="img" aria-label="IV blood bag"></div></div>
<ol id="flow-activities" class="testing-flow infusion-flow"></ol>
<div class="infusion-end"><div id="flow-brain" class="infusion-model infusion-brain" role="img" aria-label="Organ receiving the process flow"></div></div>
</div></div></section>
<script type="module" src="scene.js?v=20261014-hb2"></script>

<section id="telemetry-detail-modal" class="handoff-overlay" hidden aria-modal="true" role="dialog">
  <div class="handoff-backdrop"></div>
  <div class="handoff-container">
    <div class="handoff-topbar">
      <div class="handoff-title-block">
        <span class="handoff-eyebrow" id="modal-eyebrow">PROCESS INTELLIGENCE</span>
        <h2 id="modal-heading">Modal Title <span class="handoff-subtitle" id="modal-subheading">Subtitle</span></h2>
      </div>
      <div class="modal-top-actions">
        <!-- Interactive switcher pills -->
        <div class="modal-tabs">
          <button class="modal-tab-btn" data-view="handoffs">⇄ Handoffs</button>
          <button class="modal-tab-btn" data-view="ai">⚡ AI Opps (15)</button>
          <button class="modal-tab-btn" data-view="pain">⚠️ Pain Points (15)</button>
          <button class="modal-tab-btn" data-view="tpis">🔗 TPIs (8)</button>
          <button class="modal-tab-btn" data-view="auto">● Auto (8)</button>
          <button class="modal-tab-btn" data-view="semi">● Semi (14)</button>
          <button class="modal-tab-btn" data-view="manual">● Manual (18)</button>
        </div>
        <button id="modal-close-btn" class="handoff-close-btn" type="button">
          <span>← Return to Model</span>
        </button>
      </div>
    </div>

    <!-- View 1: Synaptic Handoff Diagram -->
    <div id="view-handoffs" class="modal-subview">
      <div class="handoff-diagram-wrap">
        <div class="handoff-col col-upstream">
          <div class="col-header"><h3>Hands In</h3><small>Upstream Stakeholders</small></div>
          <div class="entity-list" id="handoff-upstream-list"></div>
        </div>
        <div class="handoff-stage-center">
          <div class="col-header"><h3>Order to Cash Flows</h3><small>Central Processing Synapses</small></div>
          <div class="flows-list" id="handoff-center-flows"></div>
        </div>
        <div class="handoff-col col-downstream">
          <div class="col-header"><h3>Receives</h3><small>Downstream Destinations</small></div>
          <div class="entity-list" id="handoff-downstream-list"></div>
        </div>
        <svg id="handoff-svg-canvas" class="handoff-svg-canvas"></svg>
      </div>
    </div>

    <!-- View 2: Generic Content View (AI Opps, Pain Points, TPIs, Processes) -->
    <div id="view-content" class="modal-subview" style="display:none;">
      <div class="modal-content-scroll" id="modal-dynamic-body"></div>
    </div>
  </div>
</section>


</body></html>
