<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#331c41"><title>Finance towers | AstraZeneca</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="process-flow.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head>
<body>
<section id="section-1" aria-label="Finance anatomy"><header><img src="./assets/astrazeneca.svg" alt="AstraZeneca" width="120" height="30"></header>
<main id="experience" aria-label="Interactive finance anatomy"><canvas id="scene" aria-label="Skeleton, heart and eight finance organs"></canvas><div id="labels"></div>
<div id="loading" role="status"><div class="load-body"></div><p id="load-message">Assembling your anatomy…</p><button id="retry" hidden>Try again</button></div>
<section id="detail" hidden><div id="process-neurons" aria-label="Tower processes"></div><p id="process-status" class="process-status" role="status" aria-live="polite"></p><button id="back"><span class="control-symbol" aria-hidden="true">←</span><span>Back to overview</span></button><div class="detail-title"><p id="organ-name"></p><span class="demo-data">Illustrative processes</span><h2 id="tower-name"></h2></div><div class="rotate-tools"><button id="reset"><span class="control-symbol reset-symbol" aria-hidden="true">↺</span><span>Reset view</span></button></div></section>
</main>
<footer><input id="assembly" type="range" min="0" max="1000" value="0" aria-label="Assemble or disassemble organs"></footer>
</section>
<section id="process-section" aria-labelledby="flow-title" hidden>
<div class="flow-heading"><h2 id="flow-title" tabindex="-1"></h2></div>
<div class="flow-column"><div class="flow-toolbar"><button id="flow-back">← Back to model</button></div>
<div id="activity-infusion" class="activity-infusion">
<svg class="infusion-tube" aria-hidden="true"><path class="infusion-tube-shell"/><path class="infusion-tube-blood"/></svg>
<div class="infusion-start"><div id="flow-bag" class="infusion-model infusion-bag" role="img" aria-label="IV blood bag"></div></div>
<ol id="flow-activities" class="testing-flow infusion-flow"></ol>
<div class="infusion-end"><div id="flow-brain" class="infusion-model infusion-brain" role="img" aria-label="Organ receiving the process flow"></div></div>
</div></div></section>
<script type="module" src="scene.js"></script></body></html>
